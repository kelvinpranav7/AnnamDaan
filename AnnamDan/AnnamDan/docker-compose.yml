version: "3.9"

services:
  api:
    build: ./backend
    container_name: annam-daan-api
    env_file: ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      - ai
    restart: unless-stopped

  ai:
    build: ./ai-services
    container_name: annam-daan-ai
    ports:
      - "8000:8000"
    restart: unless-stopped
